# Configuration for cargo-deny
# https://github.com/EmbarkStudios/cargo-deny

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "warn"
ignore = [
    # rsa 0.9: Marvin timing side channel, no fixed release. RSA is optional in
    # sage-spec (01-crypto.md O-3) and is removed from the crate in the F-03
    # crypto step; until then the advisory is acknowledged here.
    "RUSTSEC-2023-0071",
]


[bans]
multiple-versions = "allow"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
allow = [
    # Allow multiple versions of commonly duplicated crates
    { name = "base64" },
    { name = "der" },
    { name = "pkcs8" },
    { name = "signature" },
    { name = "spki" },
    { name = "syn" },
    { name = "windows-sys" },
    { name = "windows_aarch64_gnullvm" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_msvc" },
]
skip = [
]
skip-tree = [
]

[sources]
unknown-registry = "allow"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []