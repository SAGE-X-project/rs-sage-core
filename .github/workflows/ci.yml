name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout sage-spec (test vectors)
      uses: actions/checkout@v4
      with:
        repository: SAGE-X-project/sage-spec
        ref: main
        path: .sage-spec

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88.0"
        components: rustfmt, clippy

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy (all targets, all features)
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Tests (unit, integration, spec vectors, doctests)
      run: cargo test --all-features

    - name: Build the FFI library
      run: cargo build --release --features ffi

    - name: Install cbindgen (Linux only)
      if: runner.os == 'Linux'
      uses: taiki-e/install-action@v2
      with:
        tool: cbindgen@0.29.4

    - name: Verify include/sage_crypto.h matches src/ffi (Linux only)
      if: runner.os == 'Linux'
      run: make header-check

    - name: Build and run the FFI example (Linux only)
      if: runner.os == 'Linux'
      run: make -C examples/ffi run

  wasm:
    name: WASM Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88.0"
        targets: wasm32-unknown-unknown

    - name: Configure Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Install wasm-pack
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack

    - name: Build the package
      run: wasm-pack build --target web --out-dir pkg --features wasm

    - name: Check the package contents
      run: |
        test -f pkg/sage_crypto_core_bg.wasm
        test -f pkg/sage_crypto_core.js
        grep -q signRequest pkg/sage_crypto_core.d.ts
