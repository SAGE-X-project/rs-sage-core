[package]
name = "sage_crypto_core"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["SAGE Project <contact@sage-project.io>"]
description = "Core cryptographic library for SAGE with RFC 9421 support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sage-x-project/rs-sage-core"
keywords = ["cryptography", "rfc9421", "http-signatures", "ed25519", "secp256k1"]
categories = ["cryptography", "authentication"]

[lib]
name = "sage_crypto_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Cryptographic primitives
ed25519-dalek = "2.1"
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa", "std"] }
rand = "0.8"
sha2 = "0.10"

# Phase 4: HPKE and Session Management
x25519-dalek = "2.0"
hkdf = "0.12"
hmac = "0.12"
subtle = "2.5"
zeroize = { version = "1.7", features = ["derive"] }

# Phase 6: Production Security (AES-GCM)
chacha20poly1305 = "0.10"
hpke = { version = "0.14", default-features = false, features = ["x25519", "alloc", "chacha", "getrandom"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
base58 = "0.2"
bs58 = "0.5"
hex = "0.4"
pem = "1.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# HTTP message signatures (RFC 9421)
http = "0.2"
chrono = { version = "0.4", features = ["serde"] }

# Concurrency and storage
dashmap = "5.5"
parking_lot = "0.12"
uuid = { version = "1.6", features = ["v4", "js"] }
tokio = { version = "1.0", features = ["rt", "time", "sync"] }
async-trait = "0.1"


# Blockchain integration (Phase 9) - Re-implemented with alloy (safe replacement for ethers)
tiny-keccak = { version = "2.0", features = ["keccak"] }

# FFI support
libc = { version = "0.2", optional = true }

# WASM support
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Headers", "Request", "Response"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
criterion = "0.8"
proptest = "1.0"
tempfile = "3.8"

[[bench]]
name = "crypto_benchmarks"
harness = false

[[bench]]
name = "hpke_benchmarks"
harness = false

[[bench]]
name = "session_benchmarks"
harness = false


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# hpke's `getrandom` feature pulls getrandom 0.4, which needs the JS backend in browsers
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[features]
default = []
ffi = ["libc"]
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys", "getrandom", "console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1